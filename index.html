<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#176b66">
  <style>
  :root {
    --ink: #182126;
    --muted: #5f696f;
    --paper: #ffffff;
    --canvas: #f4f6f5;
    --line: #d7dedb;
    --line-strong: #aebbb6;
    --accent: #176b66;
    --accent-hover: #0f5753;
    --accent-soft: #e5f1ef;
    --gold: #9a6b16;
    --gold-soft: #fff6df;
    --danger: #a33a2b;
    --danger-soft: #fff0ed;
    --success: #1d6b42;
    --success-soft: #e9f5ee;
    --focus: #1f6feb;
  }

  * { box-sizing: border-box; }

  html { min-height: 100%; background: var(--canvas); }

  body {
    min-height: 100%;
    margin: 0;
    color: var(--ink);
    background: var(--canvas);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.55;
    letter-spacing: 0;
  }

  button, input, select, textarea { font: inherit; letter-spacing: 0; }

  button, input, select, textarea, a { outline-offset: 3px; }
  :focus-visible { outline: 3px solid var(--focus); }

  .skip-link {
    position: fixed;
    top: 8px;
    left: 8px;
    z-index: 100;
    transform: translateY(-150%);
    background: var(--ink);
    color: #fff;
    padding: 8px 12px;
    border-radius: 4px;
  }
  .skip-link:focus { transform: translateY(0); }

  .pilot-banner {
    width: 100%;
    padding: 8px 18px;
    color: #533700;
    background: var(--gold-soft);
    border-bottom: 1px solid #e5c982;
    text-align: center;
    font-weight: 700;
    font-size: 14px;
  }

  .study-header {
    background: var(--paper);
    border-bottom: 1px solid var(--line);
  }

  .study-header__inner {
    width: min(900px, calc(100% - 32px));
    min-height: 82px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    gap: 24px;
  }

  .study-brand { min-width: 0; }

  .study-kicker {
    margin: 0 0 2px;
    color: var(--accent);
    font-size: 13px;
    font-weight: 750;
    text-transform: uppercase;
  }

  .study-title {
    margin: 0;
    font-size: 20px;
    font-weight: 700;
  }

  .study-meta {
    max-width: 260px;
    color: var(--muted);
    text-align: right;
    font-size: 13px;
  }

  .study-header__actions {
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 3px;
  }

  .instruction-review-link {
    min-height: 34px;
    padding: 4px 0;
    color: var(--accent);
    background: transparent;
    border: 0;
    cursor: pointer;
    font-weight: 750;
    text-decoration: underline;
    text-underline-offset: 3px;
    white-space: nowrap;
  }
  .instruction-review-link:hover { color: var(--accent-hover); }

  .instruction-dialog {
    width: min(760px, calc(100% - 32px));
    max-height: calc(100vh - 32px);
    margin: auto;
    padding: 0;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    box-shadow: 0 18px 48px rgba(24, 33, 38, 0.2);
  }
  .instruction-dialog::backdrop { background: rgba(24, 33, 38, 0.48); }
  .instruction-dialog__scroll {
    max-height: calc(100vh - 34px);
    overflow-y: auto;
    overscroll-behavior: contain;
  }
  .instruction-dialog__header {
    position: sticky;
    top: 0;
    z-index: 2;
    min-height: 68px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 42px;
    gap: 16px;
    align-items: center;
    padding: 14px 20px;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
  }
  .instruction-dialog__header h2 { margin: 0; font-size: 21px; }
  .instruction-dialog__close {
    width: 42px;
    height: 42px;
    padding: 0;
    color: var(--ink);
    background: #fff;
    border: 1px solid var(--line-strong);
    border-radius: 5px;
    cursor: pointer;
    font-size: 28px;
    line-height: 1;
  }
  .instruction-dialog__close:hover { background: #f1f4f3; }
  .instruction-dialog__body { padding: 20px 24px 28px; }
  .instruction-dialog__notice { margin-top: 0; }
  .instruction-reference-section {
    padding: 24px 0 10px;
    border-top: 1px solid var(--line);
  }
  .instruction-reference-section:first-of-type { border-top: 0; }
  .instruction-reference-section h3 { margin-top: 4px; font-size: 19px; }

  .app-shell {
    width: min(820px, calc(100% - 32px));
    min-height: 540px;
    margin: 28px auto;
    padding: 28px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(31, 44, 40, 0.06);
  }
  .app-shell:focus { outline: none; }

  .study-footer {
    width: min(820px, calc(100% - 32px));
    margin: 0 auto 28px;
    color: var(--muted);
    text-align: center;
    font-size: 12px;
  }

  h1, h2, h3 { margin-top: 0; line-height: 1.25; letter-spacing: 0; }
  h1 { margin-bottom: 14px; font-size: 28px; }
  h2 { margin: 30px 0 12px; font-size: 21px; }
  h3 { margin: 22px 0 10px; font-size: 17px; }
  p { margin: 0 0 14px; }
  ul, ol { padding-left: 24px; }
  li { margin-bottom: 7px; }

  .lead { color: #354248; font-size: 18px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .center { text-align: center; }
  .nowrap { white-space: nowrap; }

  .progress-wrap { margin-bottom: 24px; }
  .progress-labels {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 6px;
    color: var(--muted);
    font-size: 13px;
  }
  .progress-track {
    width: 100%;
    height: 8px;
    overflow: hidden;
    background: #e7ecea;
    border-radius: 4px;
  }
  .progress-bar { height: 100%; background: var(--accent); }

  .notice {
    margin: 18px 0;
    padding: 13px 15px;
    border-left: 4px solid var(--line-strong);
    background: #f6f8f7;
  }
  .notice--info { border-left-color: var(--accent); background: var(--accent-soft); }
  .notice--warning { border-left-color: var(--gold); background: var(--gold-soft); }
  .notice--error { border-left-color: var(--danger); background: var(--danger-soft); }
  .notice--success { border-left-color: var(--success); background: var(--success-soft); }
  .notice p:last-child { margin-bottom: 0; }

  .action-row {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 26px;
  }
  .action-row--split { justify-content: space-between; }

  .button {
    min-height: 46px;
    border: 1px solid var(--accent);
    border-radius: 6px;
    padding: 10px 18px;
    color: #fff;
    background: var(--accent);
    cursor: pointer;
    font-weight: 700;
  }
  .button:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .button:disabled { opacity: 0.55; cursor: wait; }
  .button--secondary {
    color: var(--ink);
    background: #fff;
    border-color: var(--line-strong);
  }
  .button--secondary:hover { background: #f1f4f3; border-color: #7d8c86; }
  .button--danger { background: #fff; color: var(--danger); border-color: #d5a59e; }
  .button--danger:hover { background: var(--danger-soft); border-color: var(--danger); }
  .button--wide { min-width: 210px; }

  .language-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-top: 26px;
  }
  .language-button {
    min-height: 96px;
    padding: 18px;
    color: var(--ink);
    background: #fff;
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    cursor: pointer;
    text-align: left;
  }
  .language-button:hover { border-color: var(--accent); background: var(--accent-soft); }
  .language-button strong { display: block; margin-bottom: 4px; font-size: 18px; }

  .consent-item {
    display: grid;
    grid-template-columns: 22px 1fr;
    gap: 10px;
    align-items: start;
    margin: 16px 0;
  }
  .consent-item input { width: 18px; height: 18px; margin-top: 3px; }

  .instruction-index {
    display: flex;
    gap: 7px;
    margin: 4px 0 24px;
  }
  .instruction-index span {
    width: 34px;
    height: 5px;
    background: #dfe6e3;
    border-radius: 3px;
  }
  .instruction-index .active { background: var(--accent); }

  .round-timeline {
    margin: 18px 0;
    padding: 0;
    list-style: none;
    counter-reset: round-step;
    border-top: 1px solid var(--line);
  }
  .round-timeline li {
    min-height: 54px;
    display: grid;
    grid-template-columns: 34px 1fr;
    gap: 12px;
    align-items: center;
    margin: 0;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
    counter-increment: round-step;
  }
  .round-timeline li::before {
    width: 30px;
    height: 30px;
    display: grid;
    place-items: center;
    color: #fff;
    background: var(--accent);
    border-radius: 50%;
    content: counter(round-step);
    font-size: 14px;
    font-weight: 800;
  }

  .rule-table {
    width: 100%;
    margin: 16px 0 20px;
    border-collapse: collapse;
  }
  .rule-table th, .rule-table td {
    padding: 10px 12px;
    border: 1px solid var(--line);
    text-align: left;
    vertical-align: top;
  }
  .rule-table th { background: #eef2f0; }
  .rule-table td.numeric { text-align: right; font-variant-numeric: tabular-nums; }

  .formula {
    margin: 12px 0;
    padding: 10px 13px;
    background: #f4f6f5;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
  }

  fieldset {
    min-width: 0;
    margin: 0;
    padding: 0;
    border: 0;
  }
  legend { width: 100%; padding: 0; font-weight: 700; }
  .question {
    margin: 0;
    padding: 20px 0;
    border-bottom: 1px solid var(--line);
  }
  .question:last-child { border-bottom: 0; }
  .question--incorrect { margin-inline: -12px; padding-inline: 12px; background: var(--danger-soft); }
  .option {
    display: grid;
    grid-template-columns: 20px 1fr;
    gap: 9px;
    align-items: start;
    margin: 9px 0;
    cursor: pointer;
  }
  .option input { width: 17px; height: 17px; margin-top: 3px; }

  label.field-label { display: block; margin: 18px 0 7px; font-weight: 700; }
  input[type="number"], input[type="text"], select, textarea {
    width: 100%;
    min-height: 44px;
    padding: 9px 11px;
    color: var(--ink);
    background: #fff;
    border: 1px solid var(--line-strong);
    border-radius: 5px;
  }
  input[type="number"] { max-width: 170px; }
  textarea { min-height: 92px; resize: vertical; }

  .likert-row {
    display: grid;
    grid-template-columns: repeat(7, minmax(42px, 1fr));
    gap: 6px;
    max-width: 540px;
    margin-top: 10px;
  }
  .likert-row label {
    min-height: 50px;
    display: grid;
    place-items: center;
    border: 1px solid var(--line);
    border-radius: 5px;
    cursor: pointer;
  }
  .likert-row label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
  .likert-row input { position: absolute; opacity: 0; pointer-events: none; }

  .status-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    margin: 0 0 22px;
    border: 1px solid var(--line);
    border-radius: 7px;
  }
  .status-item { min-width: 0; padding: 12px 14px; border-right: 1px solid var(--line); }
  .status-item:last-child { border-right: 0; }
  .status-item span { display: block; color: var(--muted); font-size: 12px; }
  .status-item strong { display: block; margin-top: 2px; font-size: 20px; font-variant-numeric: tabular-nums; }

  .decision-surface {
    border-top: 4px solid var(--accent);
    padding-top: 24px;
  }
  .practice-surface {
    margin-top: 22px;
    padding-top: 24px;
    border-top: 4px solid var(--gold);
  }
  .practice-surface h2 { font-size: 20px; }
  .practice-action--selected,
  .practice-action--selected.button--secondary {
    color: #fff;
    background: var(--accent);
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  #practice-choice-status { min-height: 22px; margin: 8px 0 0; }
  .case-tag {
    display: inline-block;
    min-width: 132px;
    margin-bottom: 12px;
    padding: 6px 10px;
    color: #113d39;
    background: var(--accent-soft);
    border: 1px solid #a9cec9;
    border-radius: 5px;
    font-weight: 750;
    text-align: center;
  }
  .decision-math {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin: 18px 0;
  }
  .decision-math > div { padding: 12px 14px; background: #f5f7f6; border: 1px solid var(--line); }
  .decision-math span { display: block; color: var(--muted); font-size: 13px; }
  .decision-math strong { display: block; margin-top: 3px; font-size: 19px; }

  .queue-strip {
    min-height: 58px;
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 18px 0;
    padding: 10px 12px;
    background: #f5f7f6;
    border: 1px solid var(--line);
    border-radius: 6px;
  }
  .queue-label { margin-right: 4px; color: var(--muted); font-size: 13px; }
  .queue-case {
    width: 30px;
    height: 34px;
    display: grid;
    place-items: center;
    color: #21433f;
    background: #fff;
    border: 1px solid #8eaaa4;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 700;
  }

  .decision-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 22px;
  }
  .decision-actions .button { min-height: 58px; }
  .timer-line {
    min-height: 28px;
    margin-top: 14px;
    color: var(--muted);
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .timer-line strong { color: var(--gold); }

  .rule-reference {
    margin: 20px 0;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .rule-reference summary {
    min-height: 46px;
    display: flex;
    align-items: center;
    cursor: pointer;
    color: var(--accent);
    font-weight: 750;
  }
  .rule-reference__body { padding: 4px 0 14px; }
  .rule-reference__body h3 { font-size: 16px; }
  .rule-reference__body .rule-table { font-size: 14px; }

  .result-grid {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 0;
    border-top: 1px solid var(--line);
  }
  .result-grid div { padding: 11px 5px; border-bottom: 1px solid var(--line); }
  .result-grid .value { padding-left: 22px; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
  .result-grid .total { font-size: 18px; background: #f4f7f5; }

  .completion-code {
    margin: 18px 0;
    padding: 15px;
    color: #123f3a;
    background: var(--success-soft);
    border: 1px solid #9cc8ad;
    border-radius: 6px;
    text-align: center;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 25px;
    font-weight: 800;
    overflow-wrap: anywhere;
  }

  .loading {
    min-height: 360px;
    display: grid;
    place-items: center;
    color: var(--muted);
    text-align: center;
  }
  .spinner {
    width: 28px;
    height: 28px;
    margin: 0 auto 12px;
    border: 3px solid #d8e0dd;
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .fatal-message {
    max-width: 700px;
    margin: 30px auto;
    padding: 16px;
    color: var(--danger);
    background: var(--danger-soft);
    border: 1px solid #e1aca4;
  }

  @media (max-width: 680px) {
    .study-header__inner { min-height: 72px; gap: 12px; }
    .study-kicker { display: none; }
    .study-meta { display: none; }
    .study-title { font-size: 15px; }
    .instruction-review-link { font-size: 13px; }
    .instruction-dialog { width: calc(100% - 16px); max-height: calc(100vh - 16px); }
    .instruction-dialog__scroll { max-height: calc(100vh - 18px); }
    .instruction-dialog__header { padding: 10px 12px; }
    .instruction-dialog__body { padding: 16px 14px 22px; }
    .app-shell { width: 100%; min-height: calc(100vh - 72px); margin: 0; padding: 20px 16px 28px; border-width: 0; border-radius: 0; box-shadow: none; }
    h1 { font-size: 24px; }
    .language-grid, .decision-actions, .decision-math { grid-template-columns: 1fr; }
    .status-grid { grid-template-columns: 1fr 1fr; }
    .status-item { border-bottom: 1px solid var(--line); }
    .status-item:nth-child(2) { border-right: 0; }
    .status-item:last-child { grid-column: 1 / -1; border-bottom: 0; }
    .action-row, .action-row--split { align-items: stretch; flex-direction: column-reverse; }
    .action-row .button { width: 100%; }
    .likert-row { grid-template-columns: repeat(7, minmax(36px, 1fr)); gap: 3px; }
    .rule-table { font-size: 14px; }
    .rule-table th, .rule-table td { padding: 8px 7px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; }
  }
</style>

</head>

  <header class="study-header">
    <div class="study-header__inner">
      <div class="study-brand">
        <p class="study-kicker" id="study-kicker">Nghiên cứu ra quyết định</p>
        <p class="study-title" id="study-title">Quyết định trong hệ thống xử lý hồ sơ</p>
      </div>
      <div class="study-header__actions">
        <button class="instruction-review-link" id="instruction-review-button" type="button" hidden>
          Xem lại hướng dẫn
        </button>
        <div class="study-meta" id="study-meta"></div>
      </div>

  <dialog class="instruction-dialog" id="instruction-dialog" aria-labelledby="instruction-dialog-title">
    <div class="instruction-dialog__scroll" id="instruction-dialog-content"></div>
  </dialog>
  <main id="app" class="app-shell" tabindex="-1" aria-live="polite"></main>
  <footer class="study-footer">
    <span id="footer-version"></span>

<script>/**
 * Pure experiment engine. These functions have no SpreadsheetApp dependency,
 * which allows the queue, payoff, and randomization rules to be tested locally.
 */

function engineHashSeed_(value) {
  var text = String(value || "seed");
  var h = 2166136261 >>> 0;
  for (var i = 0; i < text.length; i += 1) {
    h ^= text.charCodeAt(i);
    h = Math.imul(h, 16777619) >>> 0;
  }
  return h || 1;
}

function engineRng_(seed) {
  var state = engineHashSeed_(seed);
  return function () {
    state = (state + 0x6D2B79F5) >>> 0;
    var t = state;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function engineShuffle_(values, random) {
  var result = values.slice();
  for (var i = result.length - 1; i > 0; i -= 1) {
    var j = Math.floor(random() * (i + 1));
    var tmp = result[i];
    result[i] = result[j];
    result[j] = tmp;
  }
  return result;
}

function engineBalancedArray_(firstValue, firstCount, secondValue, total, random) {
  var values = [];
  for (var i = 0; i < total; i += 1) {
    values.push(i < firstCount ? firstValue : secondValue);
  }
  return engineShuffle_(values, random);
}

function engineBuildPlan_(seed, config) {
  var random = engineRng_(seed);
  var customers = [];
  for (var customer = 0; customer < config.NUM_CUSTOMERS; customer += 1) {
    var types = engineBalancedArray_(
      "H",
      config.NUM_H_CASES,
      "L",
      config.NUM_ROUNDS,
      random
    );
    var waits = engineBalancedArray_(
      config.WAIT_UNITS_LOW,
      config.NUM_LOW_WAIT_ROUNDS,
      config.WAIT_UNITS_HIGH,
      config.NUM_ROUNDS,
      random
    );
    var priorities = [];
    for (var round = 0; round < config.NUM_ROUNDS; round += 1) {
      priorities.push(random());
    }
    customers.push({
      customer_id: customer === 0 ? "human" : "computer_" + customer,
      types: types,
      waits: waits,
      priorities: priorities
    });
  }
  return { seed: String(seed), customers: customers };
}

function engineInitialState_(seed, treatment, config) {
  if (config.TREATMENTS.indexOf(treatment) === -1) {
    throw new Error("Unknown treatment");
  }
  return {
    treatment: treatment,
    plan: engineBuildPlan_(seed, config),
    next_round: 1,
    balance: config.START_BALANCE,
    market_points: 0,
    total_served: 0,
    human_served: 0,
    human_sent: 0,
    cases: [],
    round_receipts: {},
    comprehension_passed: false,
    comprehension_attempts: [],
    practice_completed: false,
    practice_attempts: [],
    beliefs: null,
    questionnaire: null,
    completed: false
  };
}

function engineCaseValue_(type, config) {
  return type === "H" ? config.H_VALUE : config.L_VALUE;
}

function engineCasePayoff_(type, waitingUnits, config) {
  return engineCaseValue_(type, config) -
    config.WAITING_CHARGE_PER_UNIT * waitingUnits;
}

function enginePendingCases_(state) {
  return state.cases.filter(function (caseItem) {
    return caseItem.status === "waiting";
  });
}

function engineProcessorState_(state, config) {
  var backlog = enginePendingCases_(state).length;
  return {
    name: backlog <= config.FRESH_BACKLOG_THRESHOLD ? "fresh" : "busy",
    backlog_before: backlog,
    capacity: backlog <= config.FRESH_BACKLOG_THRESHOLD ?
      config.FRESH_CAPACITY : config.BUSY_CAPACITY
  };
}

function engineDisplayLabel_(treatment, actualType, processorState) {
  if (treatment === "fine") return actualType;
  if (treatment === "state_dependent" && processorState === "fresh") {
    return actualType;
  }
  return "mixed";
}

function engineComputerDecision_(displayLabel, waitingUnits, config) {
  if (displayLabel === "H") return "send";
  if (displayLabel === "L") return "not_send";
  return waitingUnits === config.WAIT_UNITS_LOW ? "send" : "not_send";
}

function enginePublicTrial_(state, config) {
  if (state.next_round > config.NUM_ROUNDS) return null;
  var index = state.next_round - 1;
  var humanPlan = state.plan.customers[0];
  var processor = engineProcessorState_(state, config);
  var actualType = humanPlan.types[index];
  var label = engineDisplayLabel_(
    state.treatment,
    actualType,
    processor.name
  );
  var waitingUnits = humanPlan.waits[index];
  var displayedValue = label === "mixed" ?
    config.MIXED_EXPECTED_VALUE : engineCaseValue_(label, config);
  var humanPending = enginePendingCases_(state).filter(function (caseItem) {
    return caseItem.owner === "human";
  }).length;

  return {
    round: state.next_round,
    label: label,
    waiting_units: waitingUnits,
    waiting_charge: waitingUnits * config.WAITING_CHARGE_PER_UNIT,
    displayed_value: displayedValue,
    displayed_net_if_served: displayedValue -
      waitingUnits * config.WAITING_CHARGE_PER_UNIT,
    current_balance: state.balance,
    own_cases_waiting: humanPending
  };
}

function engineClone_(value) {
  return JSON.parse(JSON.stringify(value));
}

function engineProcessRound_(stateInput, decisionInput, config) {
  var state = engineClone_(stateInput);
  var round = Number(decisionInput.round);
  var decision = decisionInput.decision;

  if (!state.comprehension_passed) throw new Error("Comprehension not passed");
  if (!state.practice_completed) throw new Error("Practice not completed");
  if (state.completed) throw new Error("Study already completed");
  if (["send", "not_send"].indexOf(decision) === -1) {
    throw new Error("Invalid decision");
  }

  if (state.round_receipts[String(round)]) {
    var prior = state.round_receipts[String(round)];
    if (prior.decision !== decision) throw new Error("Conflicting duplicate decision");
    return { state: state, receipt: prior, idempotent: true };
  }
  if (round !== state.next_round) throw new Error("Unexpected round");

  var index = round - 1;
  var processor = engineProcessorState_(state, config);
  var entries = [];

  for (var customer = 0; customer < config.NUM_CUSTOMERS; customer += 1) {
    var plan = state.plan.customers[customer];
    var actualType = plan.types[index];
    var waitingUnits = plan.waits[index];
    var label = engineDisplayLabel_(
      state.treatment,
      actualType,
      processor.name
    );
    var ownerDecision = customer === 0 ? decision :
      engineComputerDecision_(label, waitingUnits, config);

    if (ownerDecision === "send") {
      var caseItem = {
        case_id: "r" + round + "_c" + customer,
        owner: plan.customer_id,
        entry_round: round,
        actual_type: actualType,
        display_label: label,
        waiting_units: waitingUnits,
        waiting_charge: waitingUnits * config.WAITING_CHARGE_PER_UNIT,
        priority: plan.priorities[index],
        status: "waiting",
        served_round: null,
        payoff: null
      };
      state.cases.push(caseItem);
      entries.push(caseItem);
    }
  }

  if (decision === "send") {
    state.human_sent += 1;
  }

  var waiting = enginePendingCases_(state).sort(function (a, b) {
    if (a.entry_round !== b.entry_round) return a.entry_round - b.entry_round;
    return a.priority - b.priority;
  });
  var served = waiting.slice(0, processor.capacity);
  var humanServedThisRound = 0;
  var humanPointsThisRound = 0;

  served.forEach(function (caseItem) {
    caseItem.status = "served";
    caseItem.served_round = round;
    caseItem.payoff = engineCasePayoff_(
      caseItem.actual_type,
      caseItem.waiting_units,
      config
    );
    state.total_served += 1;
    if (caseItem.owner === "human") {
      humanServedThisRound += 1;
      humanPointsThisRound += caseItem.payoff;
      state.human_served += 1;
      state.market_points += caseItem.payoff;
      state.balance += caseItem.payoff;
    }
  });

  var humanPlan = state.plan.customers[0];
  var humanType = humanPlan.types[index];
  var humanWait = humanPlan.waits[index];
  var humanLabel = engineDisplayLabel_(
    state.treatment,
    humanType,
    processor.name
  );
  var queueAfter = enginePendingCases_(state);
  var humanWaitingAfter = queueAfter.filter(function (caseItem) {
    return caseItem.owner === "human";
  }).length;
  var computerSent = entries.filter(function (caseItem) {
    return caseItem.owner !== "human";
  }).length;

  var receipt = {
    round: round,
    decision: decision,
    timed_out: Boolean(decisionInput.timed_out),
    actual_type: humanType,
    display_label: humanLabel,
    waiting_units: humanWait,
    waiting_charge: humanWait * config.WAITING_CHARGE_PER_UNIT,
    processor_state: processor.name,
    backlog_before: processor.backlog_before,
    processor_capacity: processor.capacity,
    computer_cases_sent: computerSent,
    total_cases_sent: entries.length,
    total_cases_served: served.length,
    own_cases_served: humanServedThisRound,
    own_points_this_round: humanPointsThisRound,
    own_cases_waiting: humanWaitingAfter,
    market_queue_after: queueAfter.length,
    balance_after: state.balance,
    served_case_ids: served.map(function (caseItem) { return caseItem.case_id; })
  };

  state.round_receipts[String(round)] = receipt;
  state.next_round += 1;

  if (round === config.NUM_ROUNDS) {
    enginePendingCases_(state).forEach(function (caseItem) {
      caseItem.status = "unserved_end";
      caseItem.payoff = 0;
    });
  }

  return { state: state, receipt: receipt, idempotent: false };
}

function engineBeliefScore_(guess, truth, config) {
  return Math.max(0, config.BELIEF_MAX_POINTS - Math.abs(guess - truth));
}

function engineScoreBeliefs_(stateInput, beliefH, beliefServed, config) {
  var state = engineClone_(stateInput);
  if (state.next_round <= config.NUM_ROUNDS) throw new Error("Rounds not complete");
  if (state.beliefs) return { state: state, results: engineResults_(state, config) };

  var hGuess = Number(beliefH);
  var servedGuess = Number(beliefServed);
  if (!Number.isInteger(hGuess) || hGuess < 0 || hGuess > config.NUM_ROUNDS) {
    throw new Error("Invalid Type H estimate");
  }
  if (!Number.isInteger(servedGuess) || servedGuess < 0 ||
      servedGuess > config.MAX_TOTAL_SERVED) {
    throw new Error("Invalid service estimate");
  }

  var actualH = state.plan.customers[0].types.filter(function (type) {
    return type === "H";
  }).length;
  var hPoints = engineBeliefScore_(hGuess, actualH, config);
  var servedPoints = engineBeliefScore_(servedGuess, state.total_served, config);
  state.beliefs = {
    belief_h: hGuess,
    belief_total_served: servedGuess,
    actual_h: actualH,
    actual_total_served: state.total_served,
    h_points: hPoints,
    served_points: servedPoints,
    belief_points: hPoints + servedPoints
  };

  return { state: state, results: engineResults_(state, config) };
}

function engineResults_(state, config) {
  var beliefPoints = state.beliefs ? state.beliefs.belief_points : 0;
  var totalPoints = state.balance + beliefPoints;
  var paidPoints = Math.max(0, totalPoints);
  var bonusVnd = Math.round(
    paidPoints * 10000 / config.POINTS_PER_10000_VND
  );
  return {
    starting_balance: config.START_BALANCE,
    case_points: state.market_points,
    balance_after_cases: state.balance,
    belief_points: beliefPoints,
    total_points: totalPoints,
    paid_points: paidPoints,
    bonus_vnd: bonusVnd,
    fixed_payment_vnd: config.FIXED_PAYMENT_VND,
    total_payment_vnd: config.FIXED_PAYMENT_VND + bonusVnd,
    own_cases_sent: state.human_sent,
    own_cases_served: state.human_served,
    total_market_cases_served: state.total_served
  };
}

function engineInstructionProfile_(treatment) {
  if (treatment === "mixed") return "mixed_only";
  if (treatment === "fine") return "exact_only";
  return "variable_labels";
}
</script>
<script>(function () {
  "use strict";

  var config = window.DEMO_CONFIG;
  var params = new URLSearchParams(window.location.search);
  var profile = params.get("profile") || "variable_labels";
  var treatment = profile === "mixed_only" ? "mixed" :
    (profile === "exact_only" ? "fine" : "state_dependent");
  var version = window.QUEUE_BOOT.study_version;
  var engineKey = "queue-public-demo-engine::" + version;
  var seedKey = "queue-public-demo-seed::" + version;
  var sessionKey = "queue-study-session::" + version;
  var completionKey = "queue-study-completion::" + version;

  if (params.get("reset") === "1") {
    localStorage.removeItem(engineKey);
    localStorage.removeItem(seedKey);
    localStorage.removeItem(sessionKey);
    sessionStorage.removeItem(completionKey);
  }

  function randomSeed() {
    var existing = localStorage.getItem(seedKey);
    if (existing) return existing;
    var value = window.crypto && window.crypto.randomUUID ?
      window.crypto.randomUUID() : String(Date.now()) + "-" + String(Math.random());
    localStorage.setItem(seedKey, value);
    return value;
  }

  function freshState() {
    var created = engineInitialState_(randomSeed(), treatment, config);
    saveState(created);
    return created;
  }

  function loadState() {
    var raw = localStorage.getItem(engineKey);
    if (!raw) return freshState();
    try {
      var parsed = JSON.parse(raw);
      if (parsed.treatment !== treatment) return freshState();
      return parsed;
    } catch (ignored) {
      return freshState();
    }
  }

  function saveState(nextState) {
    localStorage.setItem(engineKey, JSON.stringify(nextState));
  }

  var state = loadState();

  function participantCode() {
    return "QL-DEMO";
  }

  function completionCode() {
    return "DEMO-COMPLETE";
  }

  function stateResponse() {
    var base = {
      participant_code: participantCode(),
      instruction_profile: engineInstructionProfile_(state.treatment)
    };
    if (state.completed) {
      base.status = "complete";
      base.language = "vi";
      base.completion_code = completionCode();
      base.results = engineResults_(state, config);
    } else if (state.beliefs) {
      base.status = "questionnaire";
      base.results = engineResults_(state, config);
    } else if (state.next_round > config.NUM_ROUNDS) {
      base.status = "beliefs";
    } else if (state.comprehension_passed && state.practice_completed) {
      base.status = "rounds";
      base.next_trial = enginePublicTrial_(state, config);
    } else if (state.comprehension_passed) {
      base.status = "practice";
    } else {
      base.status = "instructions";
    }
    return base;
  }

  function publicReceipt(result) {
    var receipt = result.receipt;
    return {
      round: receipt.round,
      decision: receipt.decision,
      timed_out: receipt.timed_out,
      own_cases_served: receipt.own_cases_served,
      own_points_this_round: receipt.own_points_this_round,
      own_cases_waiting: receipt.own_cases_waiting,
      balance_after: receipt.balance_after,
      next_trial: enginePublicTrial_(result.state, config)
    };
  }

  function responseFor(method, payload) {
    if (method === "startSession") {
      state = freshState();
      return {
        session_id: "public-demo-session",
        session_token: "public-demo-token",
        participant_code: participantCode(),
        status: "instructions",
        instruction_profile: engineInstructionProfile_(state.treatment),
        public_config: window.QUEUE_BOOT
      };
    }
    if (method === "resumeSession") return stateResponse();
    if (method === "checkComprehension") {
      var correct = {
        q1: "C", q2: "D", q3: "A", q4: "B", q5: "C",
        q6: "A", q7: "A", q8: "C", q9: "C", q10: "B"
      };
      var incorrect = Object.keys(correct).filter(function (key) {
        return !payload.answers || payload.answers[key] !== correct[key];
      }).map(function (key) { return Number(key.slice(1)); });
      if (!incorrect.length) {
        state.comprehension_passed = true;
        saveState(state);
      }
      return {
        passed: incorrect.length === 0,
        incorrect_questions: incorrect,
        attempt_number: 1,
        practice_required: incorrect.length === 0,
        next_trial: null
      };
    }
    if (method === "completePractice") {
      state.practice_attempts = state.practice_attempts || [];
      if (state.practice_completed) {
        return {
          passed: true,
          attempt_number: state.practice_attempts.length,
          correct_payoff: 70,
          next_trial: enginePublicTrial_(state, config)
        };
      }
      var calculation = Number(payload.calculation_answer);
      var correct = Number.isInteger(calculation) && calculation === 70;
      state.practice_attempts.push({
        attempt: state.practice_attempts.length + 1,
        practice_choice: payload.practice_choice,
        calculation_answer: calculation,
        calculation_correct: correct
      });
      state.practice_completed = correct;
      saveState(state);
      return {
        passed: correct,
        attempt_number: state.practice_attempts.length,
        correct_payoff: 70,
        next_trial: correct ? enginePublicTrial_(state, config) : null
      };
    }
    if (method === "submitDecision") {
      var processed = engineProcessRound_(state, {
        round: payload.round,
        decision: payload.decision,
        timed_out: Boolean(payload.timed_out)
      }, config);
      state = processed.state;
      saveState(state);
      return publicReceipt(processed);
    }
    if (method === "submitBeliefs") {
      var scored = engineScoreBeliefs_(
        state,
        payload.belief_h,
        payload.belief_total_served,
        config
      );
      state = scored.state;
      saveState(state);
      return { results: scored.results };
    }
    if (method === "submitQuestionnaire") {
      state.completed = true;
      saveState(state);
      return {
        participant_code: participantCode(),
        completion_code: completionCode(),
        results: engineResults_(state, config)
      };
    }
    throw new Error("Unknown demonstration method: " + method);
  }

  function Runner() {
    this.success = function () {};
    this.failure = function () {};
  }
  Runner.prototype.withSuccessHandler = function (handler) {
    this.success = handler;
    return this;
  };
  Runner.prototype.withFailureHandler = function (handler) {
    this.failure = handler;
    return this;
  };

  ["startSession", "resumeSession", "checkComprehension", "completePractice", "submitDecision", "submitBeliefs", "submitQuestionnaire"]
    .forEach(function (method) {
      Runner.prototype[method] = function (payload) {
        var success = this.success;
        var failure = this.failure;
        window.setTimeout(function () {
          try {
            success(responseFor(method, payload || {}));
          } catch (error) {
            failure(error);
          }
        }, 40);
      };
    });

  window.google = { script: { run: new Runner() } };
})();
</script>

  function t(key, values) {

      text = text.replace(new RegExp("\\{" + name + "\\}", "g"), String(values[name]));
    });
    return text;
  }

  function escapeHtml(value) {
    return String(value === null || value === undefined ? "" : value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function formatVnd(value) {
    return new Intl.NumberFormat(session.language === "vi" ? "vi-VN" : "en-US")
      .format(Math.round(Number(value || 0)));

      percent + '%</span></div><div class="progress-track"><div class="progress-bar" style="width:' +

  function queryValue(keys) {

  function serverCall(method, payload) {
    return new Promise(function (resolve, reject) {
      if (!window.google || !google.script || !google.script.run) {
        reject(new Error("Google Apps Script bridge is unavailable"));
        return;
      }
      var runner = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(function (error) {
          reject(new Error(error && error.message ? error.message : String(error)));
        });
      runner[method](payload);
    });
  }

  function closeInstructionReference() {
    var dialog = document.getElementById("instruction-dialog");
    if (!dialog) return;
    if (typeof dialog.close === "function" && dialog.open) dialog.close();
    else dialog.removeAttribute("open");
    if (instructionReferencePreviousFocus &&
        typeof instructionReferencePreviousFocus.focus === "function") {
      instructionReferencePreviousFocus.focus();
    }
    instructionReferencePreviousFocus = null;
  }

  function openInstructionReference() {
    if (!session.instruction_profile) return;
    var dialog = document.getElementById("instruction-dialog");
    var content = document.getElementById("instruction-dialog-content");
    instructionReferencePreviousFocus = document.activeElement;
    content.innerHTML = instructionReferenceHtml();
    document.getElementById("instruction-dialog-close").onclick = closeInstructionReference;
    if (typeof dialog.showModal === "function") dialog.showModal();
    else dialog.setAttribute("open", "");
    document.getElementById("instruction-dialog-close").focus();
  }

  function bindInstructionReference() {
    var button = document.getElementById("instruction-review-button");
    var dialog = document.getElementById("instruction-dialog");
    button.onclick = openInstructionReference;
    dialog.addEventListener("click", function (event) {
      if (event.target !== dialog) return;
      var bounds = dialog.getBoundingClientRect();
      var outside = event.clientX < bounds.left || event.clientX > bounds.right ||
        event.clientY < bounds.top || event.clientY > bounds.bottom;
      if (outside) closeInstructionReference();
    });
    dialog.addEventListener("keydown", function (event) {
      if (event.key !== "Escape") return;
      event.preventDefault();
      closeInstructionReference();
    });
    dialog.addEventListener("cancel", function (event) {
      event.preventDefault();
      closeInstructionReference();
    });
    dialog.addEventListener("close", function () {
      if (instructionReferencePreviousFocus &&
          typeof instructionReferencePreviousFocus.focus === "function") {
        instructionReferencePreviousFocus.focus();
      }
      instructionReferencePreviousFocus = null;
    });
  }

    var pages = instructionPages();
    var index = Math.max(0, Math.min(pages.length - 1, session.instruction_page));
    var page = pages[index];
    var dots = pages.map(function (_, dotIndex) {
      return '<span class="' + (dotIndex === index ? 'active' : '') + '"></span>';
    }).join("");
    show(progressHtml(2, t("progress_instructions")) +
      '<p class="small muted">' + escapeHtml(t("instruction_of", { CURRENT: index + 1, TOTAL: pages.length })) +
      '</p><div class="instruction-index" aria-hidden="true">' + dots + '</div><h1>' +
      escapeHtml(page.title) + '</h1>' + page.html + '<div class="action-row action-row--split">' +
      (index > 0 ? '<button class="button button--secondary" id="instruction-back">' + escapeHtml(t("back")) + '</button>' : '<span></span>') +
      '<button class="button button--wide" id="instruction-next">' +
      escapeHtml(index === pages.length - 1 ? t("continue") : t("continue")) + '</button></div>');
    if (index > 0) {
      document.getElementById("instruction-back").onclick = function () {
        session.instruction_page -= 1;

    }
    document.getElementById("instruction-next").onclick = function () {
      if (index < pages.length - 1) {
        session.instruction_page += 1;
        renderInstructions();
      } else {
        renderQuiz([]);
      }
    };
  }

  function renderQuiz(incorrect, message) {
    incorrect = incorrect || [];
    var questions = QUIZ[session.language];
    var blocks = questions.map(function (question, index) {
      var number = index + 1;
      var isIncorrect = incorrect.indexOf(number) >= 0;
      var options = question.o.map(function (option) {
        var checked = session.quiz_answers["q" + number] === option[0] ? " checked" : "";
        return '<label class="option"><input type="radio" name="q' + number + '" value="' +
          option[0] + '"' + checked + '><span><strong>' + option[0] + '.</strong> ' +
          escapeHtml(option[1]) + '</span></label>';
      }).join("");
      return '<fieldset class="question ' + (isIncorrect ? 'question--incorrect' : '') +
        '" id="question-' + number + '"><legend>' + number + '. ' + escapeHtml(question.q) +
        '</legend>' + options + (isIncorrect ? '<div class="notice notice--error"><p><strong>' +
        escapeHtml(t("explanation")) + ':</strong> ' + escapeHtml(question.e) + '</p></div>' : '') +
        '</fieldset>';
    }).join("");
    show(progressHtml(3, t("progress_quiz")) + '<h1>' + escapeHtml(t("quiz_title")) +
      '</h1><p class="lead">' + escapeHtml(t(isDemo() ? "demo_quiz_intro" : "quiz_intro")) + '</p>' +
      (message ? errorNotice(message) : '') + '<form id="quiz-form">' + blocks +
      '<div class="action-row action-row--split"><button type="button" class="button button--secondary" id="quiz-review">' +
      escapeHtml(t("back")) + '</button><button type="submit" class="button button--wide">' +
      escapeHtml(t("submit")) + '</button></div></form>');
    document.getElementById("quiz-review").onclick = function () {
      session.instruction_page = 0;
      renderInstructions();
    };
    document.getElementById("quiz-form").onsubmit = function (event) {
      event.preventDefault();
      var answers = {};
      var missing = false;
      for (var i = 1; i <= questions.length; i += 1) {
        var selected = document.querySelector('input[name="q' + i + '"]:checked');
        if (selected) answers["q" + i] = selected.value;
        else missing = true;
      }
      session.quiz_answers = answers;
      if (missing) {
        renderQuiz([], t("quiz_missing"));
        return;
      }
      loading();
      serverCall("checkComprehension", authPayload({ answers: answers }))
        .then(function (response) {
          if (!response.passed) {
            renderQuiz(response.incorrect_questions,
              t("quiz_incorrect", { N: response.incorrect_questions.length }));
            return;
          }
          session.current_trial = null;
          session.quiz_answers = {};
          renderQuizPassed();
        }).catch(function (error) {
          renderQuiz([], error.message || t("network_error"));
        });
    };
  }

    show(progressHtml(4, t("progress_practice")) + '<h1>' +

      '<fieldset><legend>' + escapeHtml(t("practice_action_prompt")) + '</legend><div class="decision-actions">' +

      '" id="practice-send" aria-pressed="' + (selected === "send") + '">' +
      escapeHtml(t("send")) + '</button><button type="button" class="button button--secondary practice-action' +
      (selected === "not_send" ? ' practice-action--selected' : '') +

      'min="-500" max="500" step="1" inputmode="numeric" value="' + escapeHtml(calculationValue) +
      '" required><p class="small muted">' + escapeHtml(t("practice_calc_hint")) +
      '</p><div class="action-row"><button class="button button--wide" type="submit">' +
      escapeHtml(t("practice_submit")) + '</button></div></form></section>');

    function selectPracticeChoice(choice) {
      session.practice_choice = choice;
      var sendButton = document.getElementById("practice-send");
      var notButton = document.getElementById("practice-not");
      sendButton.classList.toggle("practice-action--selected", choice === "send");
      notButton.classList.toggle("practice-action--selected", choice === "not_send");
      sendButton.setAttribute("aria-pressed", String(choice === "send"));
      notButton.setAttribute("aria-pressed", String(choice === "not_send"));
      document.getElementById("practice-choice-status").textContent =
        t("practice_choice_made", { CHOICE: choice === "send" ? t("send") : t("not_send") });
    }
    document.getElementById("practice-send").onclick = function () {
      selectPracticeChoice("send");
    };
    document.getElementById("practice-not").onclick = function () {
      selectPracticeChoice("not_send");
    };
    document.getElementById("practice-form").onsubmit = function (event) {
      event.preventDefault();
      var rawCalculation = document.getElementById("practice-calculation").value.trim();
      if (!session.practice_choice) {
        renderPractice(t("practice_missing_choice"), rawCalculation);
        return;
      }
      var calculation = Number(rawCalculation);
      if (rawCalculation === "" || !Number.isInteger(calculation)) {
        renderPractice(t("practice_missing_calc"), rawCalculation);
        return;
      }
      loading();
      serverCall("completePractice", authPayload({
        practice_choice: session.practice_choice,
        calculation_answer: calculation
      })).then(function (response) {
        if (!response.passed) {
          renderPractice(t("practice_incorrect"), calculation);
          return;
        }
        session.current_trial = response.next_trial;
        renderPracticePassed();
      }).catch(function (error) {
        renderPractice(error.message || t("network_error"), calculation);
      });
    };

  function renderDecision() {
    var trial = session.current_trial;
    if (!trial) {
      renderBeliefs();
      return;
    }
    clearDecisionTimer();
    session.decision_active = true;
    session.decision_submitting = false;
    session.decision_focus_losses = 0;
    session.decision_started_ms = performance.now();
    updateMeta(t("round") + " " + trial.round);
    var labelText = caseLabel(trial.label);
    var caseText = trial.label === "H" ? t("h_case_text") :
      (trial.label === "L" ? t("l_case_text") : t("mixed_case_text"));
    var netTitle = trial.label === "mixed" ? t("expected_net_if_served") : t("net_if_served");
    show(progressHtml(5, t("progress_rounds")) +
      '<div class="status-grid"><div class="status-item"><span>' + escapeHtml(t("round")) +
      '</span><strong>' + trial.round + ' ' + escapeHtml(t("of_rounds")) + ' ' + BOOT.num_rounds +
      '</strong></div><div class="status-item"><span>' + escapeHtml(t("current_balance")) +
      '</span><strong>' + formatPoints(trial.current_balance) + '</strong></div><div class="status-item"><span>' +
      escapeHtml(t("own_waiting")) + '</span><strong>' + trial.own_cases_waiting + '</strong></div></div>' +
      '<section class="decision-surface" aria-labelledby="decision-title"><span class="case-tag">' +
      escapeHtml(labelText) + '</span><h1 id="decision-title">' + escapeHtml(t("case_label")) +
      ': ' + escapeHtml(labelText) + '</h1><p class="lead">' + escapeHtml(caseText) + '</p>' +
      '<div class="decision-math"><div><span>' + escapeHtml(t("waiting_units")) + '</span><strong>' +
      trial.waiting_units + '</strong></div><div><span>' + escapeHtml(t("waiting_charge")) +
      '</span><strong>' + trial.waiting_charge + '</strong></div><div><span>' +
      escapeHtml(t("displayed_value")) + '</span><strong>' + trial.displayed_value + '</strong></div><div><span>' +
      escapeHtml(netTitle) + '</span><strong>' + trial.displayed_net_if_served + '</strong></div></div>' +
      queueVisual(trial.own_cases_waiting) + ruleReferenceHtml() + '<h2>' + escapeHtml(t("choose_action")) + '</h2>' +
      '<div id="decision-error"></div><div class="decision-actions"><button class="button" id="send-button">' +
      escapeHtml(t("send")) + '</button><button class="button button--secondary" id="not-button">' +
      escapeHtml(t("not_send")) + '</button></div><div class="timer-line"><span>' +
      escapeHtml(t("time_remaining")) + ': </span><strong id="timer-value">' +
      BOOT.decision_timeout_seconds + '</strong> s<br><span class="small">' +
      escapeHtml(t("timeout_default")) + '</span></div></section>');

    var remaining = BOOT.decision_timeout_seconds;
    session.timer_id = window.setInterval(function () {
      remaining -= 1;
      var timer = document.getElementById("timer-value");
      if (timer) timer.textContent = Math.max(0, remaining);
      if (remaining <= 0) {
        clearDecisionTimer();
        submitDecision("not_send", true);
      }
    }, 1000);
    document.getElementById("send-button").onclick = function () { submitDecision("send", false); };
    document.getElementById("not-button").onclick = function () { submitDecision("not_send", false); };
  }

  function submitDecision(decision, timedOut) {
    if (session.decision_submitting) return;
    session.decision_submitting = true;
    clearDecisionTimer();
    var sendButton = document.getElementById("send-button");
    var notButton = document.getElementById("not-button");
    if (sendButton) sendButton.disabled = true;
    if (notButton) notButton.disabled = true;
    var errorBox = document.getElementById("decision-error");
    if (errorBox) errorBox.innerHTML = '<div class="notice notice--info"><p>' +
      escapeHtml(t("submitting_decision")) + '</p></div>';
    var payload = authPayload({
      round: session.current_trial.round,
      decision: decision,
      timed_out: Boolean(timedOut),
      rt_ms: Math.round(performance.now() - session.decision_started_ms),
      focus_losses: session.decision_focus_losses
    });
    serverCall("submitDecision", payload).then(function (response) {
      session.decision_active = false;
      session.decision_submitting = false;
      session.current_trial = response.next_trial;
      renderRoundSummary(response);
    }).catch(function (error) {
      session.decision_submitting = false;
      if (sendButton) sendButton.disabled = false;
      if (notButton) notButton.disabled = false;
      if (errorBox) {
        errorBox.innerHTML = errorNotice(error.message || t("network_error")) +
          '<button class="button button--secondary" id="retry-decision">' + escapeHtml(t("retry")) + '</button>';
        document.getElementById("retry-decision").onclick = function () {
          submitDecision(decision, timedOut);
        };
      }
    });
  }

  function renderRoundSummary(receipt) {
    clearDecisionTimer();
    if (session.summary_timer_id) window.clearInterval(session.summary_timer_id);
    updateMeta(t("round") + " " + receipt.round);
    var sent = receipt.decision === "send" ? 1 : 0;
    var html = progressHtml(5, t("progress_rounds")) + '<h1>' +
      escapeHtml(t("round_summary", { ROUND: receipt.round })) + '</h1>' +
      (receipt.timed_out ? '<div class="notice notice--warning"><p>' + escapeHtml(t("timed_out_note")) + '</p></div>' : '') +
      '<div class="result-grid"><div>' + escapeHtml(t("sent_this_round")) + '</div><div class="value">' + sent +
      '</div><div>' + escapeHtml(t("served_this_round")) + '</div><div class="value">' + receipt.own_cases_served +
      '</div><div>' + escapeHtml(t("points_this_round")) + '</div><div class="value">' +
      formatPoints(receipt.own_points_this_round) + '</div><div>' + escapeHtml(t("waiting_after")) +
      '</div><div class="value">' + receipt.own_cases_waiting + '</div><div class="total">' +

      escapeHtml(receipt.next_trial ? t("next_round") : t("next_section")) + '</button></div>' +
      '<p class="center small muted" id="summary-countdown"></p>';
    show(html);
    var seconds = BOOT.summary_timeout_seconds;
    var advanced = false;
    function advance() {
      if (advanced) return;
      advanced = true;
      if (session.summary_timer_id) window.clearInterval(session.summary_timer_id);
      session.summary_timer_id = null;
      if (receipt.next_trial) renderDecision(); else renderBeliefs();
    }
    document.getElementById("summary-next").onclick = advance;
    function updateCountdown() {
      var element = document.getElementById("summary-countdown");
      if (element) element.textContent = t("auto_continue", { SECONDS: seconds });
    }
    updateCountdown();
    session.summary_timer_id = window.setInterval(function () {
      seconds -= 1;
      updateCountdown();
      if (seconds <= 0) advance();
    }, 1000);
  }

    var previousH = previousValues && Number.isInteger(previousValues.belief_h) ? previousValues.belief_h : "";

      escapeHtml(previousH) + '" required>' +

      escapeHtml(t("belief_served")) + '</label><input id="belief-served" type="number" min="0" max="80" step="1" value="' +

      escapeHtml(t("submit")) + '</button></div></form>');

      event.preventDefault();
      var beliefH = Number(document.getElementById("belief-h").value);
      var beliefServed = Number(document.getElementById("belief-served").value);
      if (!Number.isInteger(beliefH) || beliefH < 0 || beliefH > 20 ||

        renderBeliefs(t("beliefs_error"), {

        renderBeliefs(error.message || t("network_error"), {
          belief_h: beliefH,
          belief_total_served: beliefServed
        });

      escapeHtml(t("confusing")) + ' <span class="muted">(' + escapeHtml(t("optional")) + ')</span></label>' +
      '<textarea id="confusing" maxlength="2000"></textarea><h2>' + escapeHtml(t("about_you")) + '</h2>' +
      '<label class="field-label" for="age">' + escapeHtml(t("age")) + ' <span class="muted">(' + escapeHtml(t("optional")) + ')</span></label>' +
      '<input id="age" type="number" min="18" max="99" step="1"><label class="field-label" for="gender">' +
      escapeHtml(t("gender")) + '</label>' + optionalSelect("gender", [["female", t("female")], ["male", t("male")], ["nonbinary", t("nonbinary")], ["other", t("other")], ["prefer_not", t("prefer_not")]]) +
      '<label class="field-label" for="field">' + escapeHtml(t("field")) + '</label>' + optionalSelect("field", [["econ_business", t("econ_business")], ["stem", t("stem")], ["social_science", t("social_science")], ["humanities", t("humanities")], ["other", t("other")], ["prefer_not", t("prefer_not")]]) +
      '<label class="field-label" for="year">' + escapeHtml(t("year")) + '</label>' + optionalSelect("year", [["1", t("year_1")], ["2", t("year_2")], ["3", t("year_3")], ["4", t("year_4")], ["5_plus", t("year_5")], ["prefer_not", t("prefer_not")]]) +
      '<label class="field-label" for="prior">' + escapeHtml(t("prior")) + '</label>' + optionalSelect("prior", [["yes", t("yes")], ["no", t("no")], ["unsure", t("unsure")]]) +
      '<label class="field-label" for="risk">' + escapeHtml(t("risk")) + '</label><input id="risk" type="number" min="0" max="10" step="1">' +
      '<label class="field-label" for="patience">' + escapeHtml(t("patience")) + '</label><input id="patience" type="number" min="0" max="10" step="1">' +
      '<div class="action-row"><button class="button button--wide" type="submit">' + escapeHtml(t("finish")) + '</button></div></form>');
    document.getElementById("survey-form").onsubmit = function (event) {
      event.preventDefault();
      var getRadioValue = function (name) {
        var selected = document.querySelector('input[name="' + name + '"]:checked');
        return selected ? selected.value : "";
      };
      var questionnaire = {
        label_difficulty: getRadioValue("label_difficulty"),
        label_effect: getRadioValue("label_effect"),
        waiting_effect: getRadioValue("waiting_effect"),
        attention_check: getRadioValue("attention_check"),
        understood: document.getElementById("understood").value,
        believed: document.getElementById("believed").value,
        strategy: document.getElementById("strategy").value,
        confusing: document.getElementById("confusing").value,
        age: document.getElementById("age").value,
        gender: document.getElementById("gender").value,
        field: document.getElementById("field").value,
        year: document.getElementById("year").value,
        prior_experiments: document.getElementById("prior").value,
        gps_risk: document.getElementById("risk").value,
        gps_patience: document.getElementById("patience").value
      };
      var elapsed = Math.max(0, Math.round((Date.now() - new Date(clientStartedAt).getTime()) / 1000));
      var viewportClass = window.innerWidth < 680 ? "small" : (window.innerWidth < 1100 ? "medium" : "large");
      submitQuestionnairePayload({
        questionnaire: questionnaire,
        client_meta: {
          elapsed_seconds: elapsed,
          viewport_class: viewportClass,
          timezone_offset_minutes: new Date().getTimezoneOffset()
        }
      });
    };
  }

  function submitQuestionnairePayload(payload) {
    loading();
    serverCall("submitQuestionnaire", authPayload(payload)).then(function (response) {
        session.results = response.results;
        renderDebrief({
          language: session.language,
          participant_code: response.participant_code,
          completion_code: response.completion_code,
          results: response.results
        }, true);
      }).catch(function (error) {
        renderQuestionnaireRetry(payload, error.message || t("network_error"));
      });
  }

  function renderQuestionnaireRetry(payload, errorMessage) {
    show(progressHtml(7, t("progress_survey")) + '<h1>' + escapeHtml(t("survey_title")) +
      '</h1>' + errorNotice(errorMessage) + '<p class="lead">' + escapeHtml(t("final_retry_body")) +
      '</p><div class="action-row"><button class="button button--wide" id="retry-final">' +
      escapeHtml(t("retry")) + '</button></div>');
    document.getElementById("retry-final").onclick = function () {
      submitQuestionnairePayload(payload);
    };
  }

  function renderDebrief(completion, newlyCompleted) {
    session.instruction_profile = completion.instruction_profile ||
      session.instruction_profile;
    setLanguage(completion.language || session.language);
    session.participant_code = completion.participant_code || session.participant_code;
    session.results = completion.results;
    updateMeta();
    if (newlyCompleted) {
      completion.instruction_profile = session.instruction_profile;
      sessionStorage.setItem(COMPLETION_KEY, JSON.stringify(completion));
      clearActiveSession();
    }
    var results = completion.results || {};
    show(progressHtml(8, t("progress_done")) + '<h1>' + escapeHtml(t("debrief_title")) +
      '</h1><div class="notice notice--success"><p><strong>' + escapeHtml(t(isDemo() ? "demo_confirmed" : "confirmed")) +
      '</strong></p></div><p>' + escapeHtml(t(isDemo() ? "demo_completion_label" : "completion_label")) + ':</p><div class="completion-code" id="completion-code">' +
      escapeHtml(completion.completion_code) + '</div><p class="center">' + escapeHtml(t(isDemo() ? "demo_keep_code" : "keep_code")) +
      '</p><div class="action-row"><button class="button button--secondary" id="copy-code">' +
      escapeHtml(t("copy_code")) + '</button></div><div id="copy-status" class="center small muted"></div>' +
      '<h2>' + escapeHtml(t(isDemo() ? "demo_results_title" : "results_title")) + '</h2>' + resultsHtml(results) +
      '<div class="notice notice--info"><p>' + escapeHtml(t(isDemo() ? "demo_payment_confirm" : "payment_confirm", {
        FIXED: formatVnd(results.fixed_payment_vnd),
        BONUS: formatVnd(results.bonus_vnd),
        TOTAL: formatVnd(results.total_payment_vnd)
      })) + '</p></div><h2>' + escapeHtml(t("debrief_heading")) + '</h2><p>' + escapeHtml(t("debrief_1")) +
      '</p><p>' + escapeHtml(t("debrief_2")) + '</p><p>' + escapeHtml(t("debrief_3")) +
      '</p><p>' + escapeHtml(t("debrief_4")) + '</p>' +
      (isDemo() ? '<div class="action-row"><button class="button button--secondary" id="restart-demo">' +
        escapeHtml(t("restart_demo")) + '</button></div>' : ''));
    document.getElementById("copy-code").onclick = function () {
      var code = completion.completion_code;
      var status = document.getElementById("copy-status");
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(code).then(function () {
          status.textContent = t("copied");
        });
      } else {
        status.textContent = code;
      }
    };
    if (isDemo()) {
      document.getElementById("restart-demo").onclick = function () {
        localStorage.removeItem(STORAGE_KEY);
        localStorage.removeItem("queue-public-demo-engine::" + (BOOT.study_version || "v1"));
        localStorage.removeItem("queue-public-demo-seed::" + (BOOT.study_version || "v1"));
        sessionStorage.removeItem(COMPLETION_KEY);
        window.location.assign(window.location.pathname + "?reset=1");
      };
    }
  }

  function renderRecovery(stored, errorMessage) {
    session.instruction_profile = stored.instruction_profile || "";
    setLanguage(stored.language || session.language);
    show('<h1>' + escapeHtml(t(isDemo() ? "demo_recovery_title" : "recovery_title")) + '</h1><p class="lead">' +
      escapeHtml(t(isDemo() ? "demo_recovery_body" : "recovery_body", { CODE: stored.participant_code || "" })) + '</p>' +
      (errorMessage ? errorNotice(errorMessage) : '') + '<div class="action-row action-row--split">' +
      '<button class="button button--secondary" id="clear-session">' + escapeHtml(t("clear_local")) +
      '</button><button class="button button--wide" id="resume-session">' + escapeHtml(t(isDemo() ? "demo_resume" : "resume")) +
      '</button></div>');
    document.getElementById("clear-session").onclick = function () {
      localStorage.removeItem(STORAGE_KEY);
      session.instruction_profile = "";
      renderLanguage();
    };
    document.getElementById("resume-session").onclick = function () {
      loading();
      session.session_id = stored.session_id;
      session.session_token = stored.session_token;
      session.participant_code = stored.participant_code;
      clientStartedAt = stored.started_at || clientStartedAt;
      serverCall("resumeSession", authPayload()).then(function (response) {
        session.participant_code = response.participant_code;
        session.instruction_profile = response.instruction_profile;
        session.current_trial = response.next_trial || null;
        session.results = response.results || null;
        saveSession();
        routeServerState(response);
      }).catch(function () {
        renderRecovery(stored, t("resume_error"));
      });
    };
  }

  function routeServerState(response) {
    updateMeta();
    if (response.status === "instructions") {
      session.instruction_page = 0;
      renderInstructions();
    } else if (response.status === "practice") {
      session.practice_choice = "";
      renderPractice();
    } else if (response.status === "rounds") {
      session.current_trial = response.next_trial;
      renderDecision();
    } else if (response.status === "beliefs") {
      renderBeliefs();
    } else if (response.status === "questionnaire") {
      session.results = response.results;
      renderResults();
    } else if (response.status === "complete") {
      renderDebrief({
        language: response.language || session.language,
        participant_code: response.participant_code,
        completion_code: response.completion_code,
        results: response.results
      }, true);
    } else {
      renderInstructions();
    }
  }

  document.addEventListener("visibilitychange", function () {
    if (session.decision_active && document.hidden) session.decision_focus_losses += 1;
  });

  window.addEventListener("beforeunload", function (event) {
    if (!session.session_id || !session.decision_active) return;
    event.preventDefault();
    event.returnValue = t(isDemo() ? "demo_leave_warning" : "leave_warning");
  });

  function start() {
    bindInstructionReference();
    setLanguage(session.language);
    var completion = sessionStorage.getItem(COMPLETION_KEY);
    if (completion) {
      try {
        renderDebrief(JSON.parse(completion), false);
        return;
      } catch (ignoredCompletion) {
        sessionStorage.removeItem(COMPLETION_KEY);
      }
    }
    var stored = localStorage.getItem(STORAGE_KEY);
    if (stored) {
      try {
        renderRecovery(JSON.parse(stored));
        return;
      } catch (ignoredSession) {
        localStorage.removeItem(STORAGE_KEY);
      }
    }
    renderLanguage();
  }

  start();
})();
</script>

</body>
</html>
